<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis comidas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comidas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141613" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f5f6f1; --card: #fff; --ink: #1c211d; --soft: #626a63; --line: #e4e6df; --track: #e7e9e2;
    --primary: #12795a; --on-primary: #fff; --primary-tint: #dff3ea;
    --warn-bg: #fff3d6; --warn-ink: #6b4a00;
    --shadow: 0 1px 2px rgba(28, 33, 29, .05), 0 6px 20px rgba(28, 33, 29, .06);
    --display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .m-desayuno { --c: #8f5600; --t: #fff0d4; --r: #f5a623; }
  .m-comida { --c: #bf3425; --t: #ffe6e2; --r: #f0604d; }
  .m-merienda { --c: #ad2467; --t: #fde5f0; --r: #e0559b; }
  .m-cena { --c: #4343c2; --t: #e8e8ff; --r: #6363e0; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141613; --card: #1f221e; --ink: #eef0ea; --soft: #a3aaa2; --line: #30342e; --track: #30342e;
      --primary: #4cc79d; --on-primary: #06281d; --primary-tint: #173428;
      --warn-bg: #3d3115; --warn-ink: #f7dfa2;
      --shadow: none;
    }
    .m-desayuno { --c: #f8c56b; --t: #3a2c11; --r: #f5a623; }
    .m-comida { --c: #ff9e92; --t: #3f1f1b; --r: #f0604d; }
    .m-merienda { --c: #f59ac6; --t: #3c1b2c; --r: #e0559b; }
    .m-cena { --c: #b1b1ff; --t: #25254b; --r: #7e7ef0; }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    max-width: 560px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px);
  }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }
  h1 { font: 700 32px/1.15 var(--display); letter-spacing: -.01em; }
  .section-title { font: 700 19px/1.25 var(--display); margin: 28px 0 10px; }
  .soft { color: var(--soft); font-size: 15px; }
  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); }
  @media (prefers-color-scheme: dark) { .card { border: 1px solid var(--line); } }

  .primary, .secondary {
    width: 100%; min-height: 50px; border-radius: 14px; font-weight: 600; padding: 8px 16px;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s;
  }
  .primary { background: var(--primary); color: var(--on-primary); border: 0; }
  .secondary { background: transparent; border: 1.5px solid var(--line); }
  .primary:active, .secondary:active, .tile:active { transform: scale(.97); }

  /* Hoy: header and week */
  .top { display: flex; align-items: center; gap: 8px; }
  .top > div { flex: 1; min-width: 0; }
  .top .soft::first-letter, .day-card h3::first-letter { text-transform: uppercase; }
  .round {
    flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card);
    box-shadow: var(--shadow); display: grid; place-items: center; font-size: 22px; line-height: 1;
  }
  .round:disabled { opacity: .35; box-shadow: none; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 16px 0; }
  .wday {
    display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 72px; padding: 8px 0 9px;
    border: 0; background: none; border-radius: 16px; min-width: 0;
  }
  .wday small { font-size: 12px; font-weight: 600; color: var(--soft); }
  .wday b { font: 700 17px/1.2 var(--display); font-variant-numeric: tabular-nums; }
  .wday:disabled { opacity: .35; }
  .wday.today b { color: var(--primary); }
  .wday[aria-current="date"] { background: var(--ink); color: var(--bg); }
  .wday[aria-current="date"] small, .wday[aria-current="date"].today b { color: var(--bg); }
  .pips { display: flex; gap: 3px; height: 6px; margin-top: 2px; }
  .pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--track); }
  .wday[aria-current="date"] .pips i { background: color-mix(in srgb, var(--bg) 30%, transparent); }
  .pips i.on, .wday[aria-current="date"] .pips i.on { background: var(--r); }

  /* The plate: four arcs, one per meal */
  .progress { display: flex; align-items: center; gap: 16px; padding: 16px; margin-bottom: 16px; }
  .plate { position: relative; flex: none; width: 92px; height: 92px; }
  .plate svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .plate circle { fill: none; stroke-width: 11; stroke-linecap: round; }
  .plate .base { stroke: var(--track); }
  .plate .on { stroke: var(--r); }
  .plate .new { animation: draw .5s ease-out; }
  @keyframes draw { from { stroke-dasharray: 0 100; } }
  .plate span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 22px var(--display); font-variant-numeric: tabular-nums; }
  .progress strong { display: block; font: 700 19px/1.25 var(--display); }

  /* Meals */
  .meal { margin-bottom: 12px; overflow: hidden; scroll-margin-top: 12px; }
  .meal h2 { font: inherit; }
  .meal-head {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 12px 14px;
    border: 0; background: none; text-align: left;
  }
  .meal-head:focus-visible { outline-offset: -3px; border-radius: 20px; }
  .badge { flex: none; width: 48px; height: 48px; border-radius: 15px; background: var(--t); display: grid; place-items: center; font-size: 25px; line-height: 1; }
  .meal-text { flex: 1; min-width: 0; }
  .meal-text b { display: block; font: 700 18px/1.25 var(--display); color: var(--c); }
  .meal-text span { display: block; font-size: 14px; color: var(--soft); overflow-wrap: anywhere; }
  .done { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
  .chev { flex: none; width: 18px; height: 18px; color: var(--soft); transition: transform .2s; }
  .open .chev { transform: rotate(180deg); }
  .meal-body { padding: 2px 14px 14px; }
  .enter { animation: rise .24s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; min-height: 118px; padding: 13px;
    border: 0; border-radius: 16px; background: var(--t); text-align: left; font-weight: 600; font-size: 15px; line-height: 1.3;
    overflow-wrap: anywhere; transition: transform .12s;
  }
  .tile em { font-style: normal; font-size: 30px; line-height: 1; }
  .tile.cheat { grid-column: 1 / -1; min-height: 60px; flex-direction: row; align-items: center; background: none; border: 1.5px dashed var(--r); }

  .chosen-head { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: var(--t); }
  .chosen-head strong { flex: 1; min-width: 0; font: 700 16px/1.3 var(--display); overflow-wrap: anywhere; }
  .change { flex: none; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--card); color: var(--c); font-size: 14px; font-weight: 600; }
  .block h3 { margin: 18px 0 8px; font: 700 15px/1.3 var(--display); color: var(--c); }
  .ingredients { list-style: none; margin: 0; padding: 0; }
  .ingredients li { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .ingredients li:first-child { border-top: 0; padding-top: 0; }
  .ingredients b { flex: none; min-width: 52px; font-variant-numeric: tabular-nums; }
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .steps li { position: relative; padding-left: 34px; margin-bottom: 10px; counter-increment: step; overflow-wrap: anywhere; }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%;
    background: var(--t); color: var(--c); font-size: 13px; font-weight: 700; display: grid; place-items: center;
  }
  .steps.single li { padding-left: 0; }
  .steps.single li::before { display: none; }
  .note { display: flex; gap: 8px; padding: 10px 12px; margin-bottom: 8px; border-radius: 12px; background: var(--bg); font-size: 14px; overflow-wrap: anywhere; }
  .field { width: 100%; padding: 12px 14px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; font-size: 16px; }
  .field:focus { border-color: var(--primary); outline: 0; }
  textarea.field { min-height: 150px; resize: vertical; display: block; line-height: 1.4; }
  .chosen-note { margin-top: 10px; }

  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
  .banner p { flex: 1 1 180px; font-size: 15px; }
  .banner .primary { width: auto; min-height: 44px; flex: none; }
  .empty { text-align: center; padding: 28px 20px; margin-bottom: 12px; }
  .empty em { font-style: normal; font-size: 48px; display: block; margin-bottom: 8px; }
  .empty p { margin-bottom: 16px; }

  /* Historial */
  .stack { display: grid; gap: 10px; padding: 16px; }
  .day-card { padding: 14px 16px; margin-bottom: 10px; }
  .day-card header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .day-card h3 { flex: 1; font: 700 16px/1.3 var(--display); }
  .day-row { display: flex; gap: 10px; padding: 6px 0; align-items: flex-start; }
  .day-row em { flex: none; width: 30px; height: 30px; border-radius: 10px; background: var(--t); display: grid; place-items: center; font-style: normal; font-size: 16px; }
  .day-row div { min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
  .day-row small { display: block; font-size: 12px; font-weight: 600; color: var(--c); }

  /* Consejos */
  .tip { display: flex; gap: 12px; padding: 14px; margin-bottom: 10px; }
  .tip em { flex: none; width: 42px; height: 42px; border-radius: 14px; background: var(--primary-tint); display: grid; place-items: center; font-style: normal; font-size: 22px; }
  .tip div { min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
  .tip strong { display: block; font: 700 16px/1.3 var(--display); margin-bottom: 2px; }

  /* Pauta */
  .edit { margin-bottom: 10px; }
  .edit summary { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 14px; cursor: pointer; list-style: none; font-weight: 600; }
  .edit summary::-webkit-details-marker { display: none; }
  .edit .grow { flex: 1; min-width: 0; }
  .edit summary small { display: block; font-weight: 400; color: var(--soft); font-size: 14px; }
  .edit[open] .chev { transform: rotate(180deg); }
  .edit .field { width: calc(100% - 28px); margin: 0 14px 14px; }
  .help { font-size: 14px; }
  .help code { font-family: inherit; font-weight: 700; color: var(--primary); }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; z-index: 5;
    background: color-mix(in srgb, var(--card) 88%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
    border-top: 1px solid var(--line); padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px);
  }
  nav button {
    flex: 1; max-width: 140px; min-width: 0; min-height: 54px; border: 0; background: none; color: var(--soft); border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600;
  }
  nav svg { width: 24px; height: 24px; }
  nav button[aria-current="page"] { color: var(--primary); }

  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 6; display: flex; justify-content: center; pointer-events: none;
  }
  #toast div { max-width: 520px; padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500; animation: rise .2s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" aria-live="polite"></div>
<nav id="tabs" aria-label="Secciones"></nav>
<script src="logic.js"></script>
<script>
const KEY = 'comidas-v1';
const LABELS = { desayuno: 'Desayuno', comida: 'Comida', merienda: 'Merienda', cena: 'Cena', consejos: 'Consejos' };
const EMOJI = { desayuno: '🍳', comida: '🍲', merienda: '🍎', cena: '🌙', consejos: '💡' };
const CHEAT_EMOJI = '🍕';
const WEEKDAYS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
const svg = (body, attrs = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${attrs}>${body}</svg>`;
const CHEVRON = svg('<path d="m6 9 6 6 6-6"/>', 'class="chev"');
const CHECK = svg('<path d="m6 12 4 4 8-9"/>', 'width="14" height="14" stroke-width="3"');
const TABS = {
  hoy: ['Hoy', svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>')],
  historial: ['Historial', svg('<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>')],
  consejos: ['Consejos', svg('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3Z"/>')],
  pauta: ['Pauta', svg('<path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M9 8h6M9 12h6M9 16h4"/>')],
};
const app = document.getElementById('app');

let tab = 'hoy';
let viewDay = null; // null follows today, so the app rolls over at midnight
let openMeal; // undefined opens the next meal to choose, null keeps them all closed
let enterMeal = null; // the only meal that animates on this render
let corruptFound = false;
let state = emptyState();
const drawnArcs = new Set();

try {
  const loaded = loadState(localStorage.getItem(KEY));
  state = loaded.state;
  if (loaded.corrupt !== null) {
    corruptFound = true;
    localStorage.setItem(`${KEY}-corrupt-${Date.now()}`, loaded.corrupt);
  }
} catch {
  corruptFound = true;
}
navigator.storage?.persist?.();

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch {
    alert('No se ha podido guardar en el móvil. Haz una copia de seguridad desde Historial.');
  }
}

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'html') node.innerHTML = v; // only ever our own constants
    else if (k in node) node[k] = v;
    else node.setAttribute(k, v);
  }
  node.append(...children);
  return node;
}

let toastTimer;
function toast(message) {
  const box = document.getElementById('toast');
  box.replaceChildren(el('div', {}, message));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.replaceChildren(), 4000);
}

const longDate = key => keyToDate(key).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
const dayLog = day => state.log[day] || {};
const emojiFor = (meal, text) => (isCheat(text) ? CHEAT_EMOJI : splitEmoji(text).emoji || EMOJI[meal]);
const nameOf = text => splitEmoji(text).name;

async function saveBackup() {
  const now = new Date();
  const file = new File(
    [JSON.stringify(makeBackup(state, now), null, 1)],
    `comidas-copia-${dateKey(now)}.json`,
    { type: 'application/json' },
  );
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Copia de Mis comidas' });
    } catch (e) {
      if (e.name !== 'AbortError') toast('No se ha podido guardar la copia. Inténtalo de nuevo.');
      return;
    }
  } else {
    const url = URL.createObjectURL(file);
    el('a', { href: url, download: file.name }).click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
  state.lastBackup = now.toISOString();
  save();
  render();
  toast('Copia guardada');
}

async function restoreBackup(file) {
  try {
    if (file.size > 5 * 1024 * 1024) throw new Error('El archivo no es una copia válida');
    const result = mergeBackup(state, parseBackup(await file.text()));
    state = result.state;
    corruptFound = false;
    save();
    render();
    toast(`Copia restaurada. Comidas recuperadas: ${result.added}.`);
  } catch (e) {
    toast(`${e.message}. No se ha cambiado nada.`);
  }
}

function banners() {
  const out = [];
  if (corruptFound) {
    out.push(el('div', { className: 'banner', role: 'alert' },
      el('p', {}, 'No se han podido leer los datos guardados. Restaura tu última copia desde Historial.')));
  }
  if (needsBackup(state, new Date())) {
    out.push(el('div', { className: 'banner' },
      el('p', {}, state.lastBackup ? 'Hace más de una semana de tu última copia.' : 'Protege tu historial con una copia.'),
      el('button', { className: 'primary', onclick: saveBackup }, 'Guardar copia')));
  }
  return out;
}

function plate(day) {
  const log = dayLog(day);
  const done = MEALS.filter(m => log[m]).length;
  const arcs = MEALS.map((meal, i) => {
    // pathLength 100 with a quarter per meal; the gap leaves room for the round caps
    const attrs = `cx="50" cy="50" r="42" pathLength="100" stroke-dasharray="17 83" stroke-dashoffset="${-(i * 25 + 4)}"`;
    if (!log[meal]) return `<circle class="base" ${attrs}/>`;
    const id = `${day}/${meal}`;
    const isNew = !drawnArcs.has(id);
    drawnArcs.add(id);
    return `<circle class="on m-${meal}${isNew ? ' new' : ''}" ${attrs}/>`;
  }).join('');
  return el('div', { className: 'plate', role: 'img', 'aria-label': `${done} de 4 comidas marcadas` },
    el('div', { html: `<svg viewBox="0 0 100 100" aria-hidden="true">${arcs}</svg>` }),
    el('span', { 'aria-hidden': 'true' }, `${done}/4`));
}

const pips = day => el('span', { className: 'pips', 'aria-hidden': 'true' },
  ...MEALS.map(m => el('i', { className: `m-${m}${dayLog(day)[m] ? ' on' : ''}` })));

function weekStrip(day, today) {
  const monday = addDays(day, -((keyToDate(day).getDay() + 6) % 7));
  return el('div', { className: 'week' }, ...WEEKDAYS.map((letter, i) => {
    const key = addDays(monday, i);
    return el('button', {
      className: `wday${key === today ? ' today' : ''}`,
      disabled: key > today,
      'aria-label': `${longDate(key)}, ${MEALS.filter(m => dayLog(key)[m]).length} de 4 comidas`,
      ...(key === day ? { 'aria-current': 'date' } : {}),
      onclick: () => goTo(key),
    }, el('small', {}, letter), el('b', {}, String(keyToDate(key).getDate())), pips(key));
  }));
}

function goTo(key) {
  viewDay = key === dateKey(new Date()) ? null : key;
  openMeal = undefined;
  render();
}

function chosenBody(day, meal, selected, pick) {
  const cheat = isCheat(selected);
  const lines = cheat ? [] : detailsOf(state.details, meal, selected);
  const prep = cheat ? [] : detailsOf(state.prep, meal, selected);
  const tips = cheat ? [] : state.tips[meal];
  return [
    el('div', { className: 'chosen-head' },
      el('strong', {}, cheat ? CHEAT : nameOf(selected)),
      el('button', { className: 'change', 'aria-label': `Cambiar ${LABELS[meal]}`, onclick: () => pick(null) }, 'Cambiar')),
    ...(cheat ? [el('input', {
      className: 'field chosen-note', placeholder: 'Qué ha sido (opcional)…', 'aria-label': `Cheat meal de ${LABELS[meal]}: qué ha sido`,
      value: cheatNote(selected),
      oninput: e => { setMeal(state.log, day, meal, cheatText(e.target.value)); save(); },
    })] : []),
    ...(lines.length ? [el('section', { className: 'block' }, el('h3', {}, 'Ingredientes'),
      el('ul', { className: 'ingredients' }, ...lines.map(line => {
        const { qty, name } = splitQuantity(line);
        return el('li', {}, ...(qty ? [el('b', {}, qty)] : []), el('span', {}, name));
      })))] : []),
    ...(prep.length ? [el('section', { className: 'block' }, el('h3', {}, 'Preparación'),
      el('ol', { className: `steps${prep.length === 1 ? ' single' : ''}` }, ...prep.map(step => el('li', {}, step))))] : []),
    ...(tips.length ? [el('section', { className: 'block' }, el('h3', {}, 'Consejos'),
      ...tips.map(tip => {
        const { emoji, name } = splitEmoji(tip);
        return el('p', { className: 'note' }, el('span', { 'aria-hidden': 'true' }, emoji || EMOJI.consejos), el('span', {}, name));
      }))] : []),
  ];
}

function mealCard(day, meal, isOpen) {
  const selected = dayLog(day)[meal];
  const pick = text => {
    setMeal(state.log, day, meal, text);
    save();
    openMeal = meal;
    enterMeal = meal;
    render();
  };
  const names = [...state.options[meal], ...(isWeekend(day) ? [CHEAT] : [])];
  const subtitle = selected
    ? (isOpen ? 'Tu elección' : nameOf(selected))
    : (names.length ? 'Elige qué has comido' : 'Sin opciones en la pauta');
  const toggle = () => {
    openMeal = isOpen ? null : meal;
    enterMeal = meal;
    render();
    if (!isOpen) document.getElementById(`meal-${meal}`).scrollIntoView({ block: 'nearest' });
  };
  const body = !isOpen ? [] : [el('div', { className: `meal-body${enterMeal === meal ? ' enter' : ''}` },
    ...(selected
      ? chosenBody(day, meal, selected, pick)
      : [el('div', { className: 'tiles' }, ...names.map(option => el('button', {
        className: `tile${option === CHEAT ? ' cheat' : ''}`, onclick: () => pick(option),
      },
      el('em', { 'aria-hidden': 'true' }, emojiFor(meal, option)),
      el('span', {}, nameOf(option)))))]))];
  return el('section', { className: `card meal m-${meal}${isOpen ? ' open' : ''}`, id: `meal-${meal}` },
    el('h2', {}, el('button', { className: 'meal-head', 'aria-expanded': String(isOpen), onclick: toggle },
      el('span', { className: 'badge', 'aria-hidden': 'true' }, selected ? emojiFor(meal, selected) : EMOJI[meal]),
      el('span', { className: 'meal-text' }, el('b', {}, LABELS[meal]), el('span', {}, subtitle)),
      ...(selected ? [el('span', { className: 'done', html: CHECK })] : []),
      el('span', { html: CHEVRON, style: 'display:contents' }))),
    ...body);
}

function renderHoy() {
  const today = dateKey(new Date());
  const day = viewDay || today;
  const log = dayLog(day);
  const next = MEALS.find(m => !log[m]);
  const isOpen = openMeal === undefined ? next : openMeal;
  const hasOptions = MEALS.some(m => state.options[m].length);
  const week = n => {
    const target = addDays(day, n * 7);
    goTo(target > today ? today : target);
  };
  const thisWeekEnds = addDays(day, 6 - ((keyToDate(day).getDay() + 6) % 7));
  app.append(
    el('div', { className: 'top' },
      el('div', {},
        el('h1', {}, day === today ? 'Hoy' : day === addDays(today, -1) ? 'Ayer' : keyToDate(day).toLocaleDateString('es-ES', { weekday: 'long' }).replace(/^./, c => c.toUpperCase())),
        el('p', { className: 'soft' }, day === today || day === addDays(today, -1)
          ? longDate(day)
          : keyToDate(day).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' }))),
      el('button', { className: 'round', 'aria-label': 'Semana anterior', onclick: () => week(-1) }, '‹'),
      el('button', { className: 'round', 'aria-label': 'Semana siguiente', disabled: thisWeekEnds >= today, onclick: () => week(1) }, '›')),
    weekStrip(day, today),
    ...banners(),
    ...(hasOptions
      ? [el('div', { className: 'card progress' }, plate(day),
        el('div', {},
          el('strong', {}, next ? `Siguiente: ${LABELS[next].toLowerCase()}` : '¡Día completo! 🎉'),
          el('p', { className: 'soft' }, next ? `${EMOJI[next]} Elige lo que más te apetezca` : 'Has marcado las cuatro comidas')))]
      : [el('div', { className: 'card empty' },
        el('em', { 'aria-hidden': 'true' }, '🍽️'),
        el('p', { className: 'soft' }, 'Añade tu pauta para ver aquí tus comidas de cada día.'),
        el('button', { className: 'primary', onclick: () => { tab = 'pauta'; render(); } }, 'Añadir pauta'))]),
    ...(hasOptions || Object.keys(log).length ? MEALS.map(meal => mealCard(day, meal, isOpen === meal)) : []),
  );
  enterMeal = null;
}

function renderHistorial() {
  const picker = el('input', {
    type: 'file', hidden: true,
    onchange: e => { if (e.target.files[0]) restoreBackup(e.target.files[0]); e.target.value = ''; },
  });
  const days = Object.keys(state.log).sort().reverse();
  app.append(
    el('h1', {}, 'Historial'),
    el('h2', { className: 'section-title' }, '🛟 Copia de seguridad'),
    el('div', { className: 'card stack' },
      el('p', { className: 'soft' }, state.lastBackup
        ? `Última copia: ${new Date(state.lastBackup).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}. Guárdala en iCloud Drive.`
        : 'Sin copias todavía. Guárdala en iCloud Drive para recuperar tu historial si borras la app.'),
      el('button', { className: 'primary', onclick: saveBackup }, 'Guardar copia'),
      el('button', { className: 'secondary', onclick: () => picker.click() }, 'Restaurar copia'),
      picker),
    el('h2', { className: 'section-title' }, '🗓️ Tus días'),
    ...(days.length ? [] : [el('div', { className: 'card empty' },
      el('em', { 'aria-hidden': 'true' }, '🍽️'),
      el('p', { className: 'soft', style: 'margin:0' }, 'Aquí verás lo que vayas marcando cada día.'))]),
    ...days.map(day => el('article', { className: 'card day-card' },
      el('header', {}, el('h3', {}, longDate(day)), pips(day)),
      ...MEALS.filter(m => state.log[day][m]).map(m => el('div', { className: `day-row m-${m}` },
        el('em', { 'aria-hidden': 'true' }, emojiFor(m, state.log[day][m])),
        el('div', {}, el('small', {}, LABELS[m]), nameOf(state.log[day][m])))))),
  );
}

function renderConsejos() {
  const tips = state.tips[GENERAL];
  app.append(
    el('h1', { style: 'margin-bottom:16px' }, 'Consejos'),
    ...(tips.length
      ? tips.map(tip => {
        const { emoji, name } = splitEmoji(tip);
        const title = name.match(/^([^:]{3,40}):\s+(.+)$/);
        return el('article', { className: 'card tip' },
          el('em', { 'aria-hidden': 'true' }, emoji || EMOJI.consejos),
          el('div', {}, ...(title ? [el('strong', {}, title[1]), title[2]] : [name])));
      })
      : [el('div', { className: 'card empty' },
        el('em', { 'aria-hidden': 'true' }, '💡'),
        el('p', { className: 'soft', style: 'margin:0' }, 'Aquí verás los consejos generales de tu pauta.'))]),
  );
}

function renderPauta() {
  const finish = (changes, message) => {
    Object.assign(state, changes);
    save();
    tab = 'hoy';
    viewDay = null;
    openMeal = undefined;
    render();
    window.scrollTo(0, 0);
    toast(message);
  };
  const attempt = build => {
    try {
      finish(build(), 'Pauta guardada. Tu historial sigue igual.');
    } catch (e) {
      toast(`${e.message}. No se ha guardado nada.`);
    }
  };
  const pasted = el('textarea', { className: 'field', placeholder: 'Pega aquí tu pauta completa…', 'aria-label': 'Pauta completa' });
  const boxes = {};
  const sections = SECTIONS.map(section => {
    boxes[section] = el('textarea', { className: 'field', 'aria-label': LABELS[section], value: formatBox(state, section) });
    const count = section === GENERAL ? state.tips[GENERAL].length : state.options[section].length;
    return el('details', { className: `card edit m-${section}` },
      el('summary', {},
        el('span', { className: 'badge', style: section === GENERAL ? 'background:var(--primary-tint)' : '', 'aria-hidden': 'true' }, EMOJI[section]),
        el('span', { className: 'grow' }, LABELS[section], el('small', {}, `${count} ${section === GENERAL ? 'consejos' : 'opciones'}`)),
        el('span', { html: CHEVRON, style: 'display:contents' })),
      boxes[section]);
  });
  app.append(
    el('h1', {}, 'Tu pauta'),
    el('p', { className: 'soft', style: 'margin-top:4px' }, 'Cada mes, tras tu revisión, actualízala aquí. Tu historial no cambia.'),
    el('h2', { className: 'section-title' }, '📋 Pegar pauta nueva'),
    el('div', { className: 'card stack' },
      pasted,
      el('button', { className: 'primary', onclick: () => attempt(() => applyPaste(state, pasted.value)) }, 'Guardar pauta')),
    el('h2', { className: 'section-title' }, '✏️ Editar a mano'),
    ...sections,
    el('button', {
      className: 'secondary',
      onclick: () => attempt(() => parseBoxes(Object.fromEntries(SECTIONS.map(s => [s, boxes[s].value])))),
    }, 'Guardar cambios'),
    el('p', { className: 'soft help', style: 'margin-top:16px' },
      'Cada línea es una opción. Debajo, ', el('code', {}, '-'), ' indica un ingrediente, ', el('code', {}, '>'),
      ' un paso de preparación y ', el('code', {}, '!'), ' un consejo para toda la comida. Una línea como ',
      el('code', {}, '# Cena'), ' empieza otra sección. Si una opción empieza por un emoji, se usa como su imagen.'),
  );
}

function render() {
  app.replaceChildren();
  ({ hoy: renderHoy, historial: renderHistorial, consejos: renderConsejos, pauta: renderPauta })[tab]();
  document.getElementById('tabs').replaceChildren(...Object.entries(TABS).map(([id, [label, icon]]) => el('button', {
    ...(id === tab ? { 'aria-current': 'page' } : {}),
    onclick: () => { tab = id; render(); window.scrollTo(0, 0); },
  }, el('span', { html: icon, style: 'display:contents' }), label)));
}

// Skip the Pauta tab so coming back from copying the plan doesn't wipe what was typed.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && tab !== 'pauta') render();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
